name: Test platforms and endpoint inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Write buildkitd config file
        run: |
          mkdir -p /tmp/buildkitd-config
          cat > /tmp/buildkitd-config/buildkitd.toml <<'EOF'
          [worker.oci]
            max-parallelism = 2
          EOF
      - id: action
        uses: .
        with:
          buildkitd-config: /tmp/buildkitd-config/buildkitd.toml
          platforms: 'linux/amd64'
          endpoint: 'unix:///var/run/docker.sock'
          use: 'true'
          cleanup: 'true'
      - name: Assert builder name output is set
        env:
          ACTUAL: ${{ steps.action.outputs.name }}
        run: |
          echo "actual name: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty builder name"
            exit 1
          fi
          echo "PASS: builder name is $ACTUAL"
      - name: Assert platforms output is set
        env:
          ACTUAL: ${{ steps.action.outputs.platforms }}
        run: |
          echo "actual platforms: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty platforms"
            exit 1
          fi
          echo "PASS: platforms is $ACTUAL"
