name: Test append input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create initial builder
        id: initial-builder
        uses: .
        with:
          name: 'test-append-builder'
          use: 'true'
      - name: Assert initial builder name output is set
        env:
          BUILDER_NAME: ${{ steps.initial-builder.outputs.name }}
        run: |
          echo "builder name: $BUILDER_NAME"
          if [ -z "$BUILDER_NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS"
      - id: action
        uses: .
        with:
          name: 'test-append-builder'
          append: |
            - endpoint: unix:///var/run/docker.sock
              platforms: linux/amd64
          use: 'true'
      - name: Assert builder name output is set after append
        env:
          BUILDER_NAME: ${{ steps.action.outputs.name }}
        run: |
          echo "builder name: $BUILDER_NAME"
          if [ -z "$BUILDER_NAME" ]; then
            echo "FAIL: expected builder name to be set after append"
            exit 1
          fi
          echo "PASS"
