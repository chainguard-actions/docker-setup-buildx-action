name: Test endpoint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          driver: 'docker-container'
          endpoint: 'unix:///var/run/docker.sock'
          use: 'true'
      - name: Assert builder name and endpoint outputs are set
        env:
          BUILDER_NAME: ${{ steps.action.outputs.name }}
          BUILDER_ENDPOINT: ${{ steps.action.outputs.endpoint }}
        run: |
          echo "builder name: $BUILDER_NAME"
          echo "builder endpoint: $BUILDER_ENDPOINT"
          if [ -z "$BUILDER_NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS: builder '$BUILDER_NAME' created with endpoint"
