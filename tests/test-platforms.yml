name: Test platforms input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          platforms: 'linux/amd64,linux/arm64'
          use: 'true'
      - name: Assert builder name output is set
        env:
          BUILDER_NAME: ${{ steps.action.outputs.name }}
        run: |
          echo "builder name: $BUILDER_NAME"
          if [ -z "$BUILDER_NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS"
      - name: Assert platforms output contains expected platforms
        env:
          PLATFORMS: ${{ steps.action.outputs.platforms }}
        run: |
          echo "platforms: $PLATFORMS"
          if [ -z "$PLATFORMS" ]; then
            echo "FAIL: expected platforms output to be set"
            exit 1
          fi
          if echo "$PLATFORMS" | grep -q "linux/amd64"; then
            echo "PASS: platforms output contains linux/amd64"
          else
            echo "FAIL: expected platforms to contain linux/amd64, got: $PLATFORMS"
            exit 1
          fi
