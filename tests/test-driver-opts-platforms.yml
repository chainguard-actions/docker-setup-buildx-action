name: Test driver-opts and platforms inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: buildx
        uses: .
        with:
          driver: 'docker-container'
          driver-opts: 'network=host'
          platforms: 'linux/amd64'
          use: 'true'
          cleanup: 'true'
      - name: Assert builder name output is set
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          echo "builder name: $BUILDER_NAME"
          if [ -z "$BUILDER_NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS"
      - name: Assert platforms output is set
        env:
          PLATFORMS: ${{ steps.buildx.outputs.platforms }}
        run: |
          echo "platforms: $PLATFORMS"
          if [ -z "$PLATFORMS" ]; then
            echo "FAIL: expected platforms to be set"
            exit 1
          fi
          echo "PASS"
