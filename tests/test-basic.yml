name: Test basic buildx setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: buildx
        uses: .
      - name: Assert builder name output is set
        env:
          ACTUAL: ${{ steps.buildx.outputs.name }}
        run: |
          echo "actual name: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected builder name to be non-empty"
            exit 1
          fi
          echo "PASS: builder name is '$ACTUAL'"
      - name: Assert driver output is set
        env:
          ACTUAL: ${{ steps.buildx.outputs.driver }}
        run: |
          echo "actual driver: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected driver to be non-empty"
            exit 1
          fi
          echo "PASS: driver is '$ACTUAL'"
      - name: Assert platforms output is set
        env:
          ACTUAL: ${{ steps.buildx.outputs.platforms }}
        run: |
          echo "actual platforms: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected platforms to be non-empty"
            exit 1
          fi
          echo "PASS: platforms is '$ACTUAL'"
      - name: Assert nodes output is set
        env:
          ACTUAL: ${{ steps.buildx.outputs.nodes }}
        run: |
          echo "actual nodes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected nodes to be non-empty"
            exit 1
          fi
          echo "PASS: nodes is set"
      - name: Assert status output is set
        env:
          ACTUAL: ${{ steps.buildx.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected status to be non-empty"
            exit 1
          fi
          echo "PASS: status is '$ACTUAL'"
      - name: Assert buildx is active builder
        run: |
          CURRENT=$(docker buildx ls | grep '\*' | awk '{print $1}' | tr -d '*')
          echo "current builder: $CURRENT"
          if [ -z "$CURRENT" ]; then
            echo "FAIL: no active builder found"
            exit 1
          fi
          echo "PASS: active builder is '$CURRENT'"
