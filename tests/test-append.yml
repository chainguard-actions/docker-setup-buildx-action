name: Test append input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create primary builder
        id: primary
        uses: .
        with:
          name: 'append-test-builder'
          driver: 'docker-container'
          use: 'true'
      - name: Assert primary builder name
        env:
          ACTUAL: ${{ steps.primary.outputs.name }}
        run: |
          echo "actual name: $ACTUAL"
          if [ "$ACTUAL" != "append-test-builder" ]; then
            echo "FAIL: expected builder name 'append-test-builder', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - id: buildx
        uses: .
        with:
          name: 'append-test-builder'
          driver: 'docker-container'
          append: |
            - endpoint: unix:///var/run/docker.sock
          use: 'true'
      - name: Assert builder name is set
        env:
          ACTUAL: ${{ steps.buildx.outputs.name }}
        run: |
          echo "actual name: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected builder name to be non-empty"
            exit 1
          fi
          echo "PASS: builder name is '$ACTUAL'"
      - name: Assert nodes output is set
        env:
          ACTUAL: ${{ steps.buildx.outputs.nodes }}
        run: |
          echo "actual nodes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected nodes to be non-empty"
            exit 1
          fi
          echo "PASS: nodes is set"
