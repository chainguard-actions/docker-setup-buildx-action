name: Test append input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create initial builder
        id: initial
        uses: .
        with:
          driver: 'docker-container'
          name: 'test-append-builder'
          use: 'true'
      - name: Assert initial builder created
        env:
          BUILDER_NAME: ${{ steps.initial.outputs.name }}
        run: |
          echo "initial builder name: $BUILDER_NAME"
          if [ -z "$BUILDER_NAME" ]; then
            echo "FAIL: expected initial builder name to be set"
            exit 1
          fi
          echo "PASS: initial builder name is '$BUILDER_NAME'"
      - id: action
        uses: .
        with:
          driver: 'docker-container'
          name: 'test-append-builder'
          append: |
            - endpoint: unix:///var/run/docker.sock
          use: 'true'
      - name: Assert builder name output is set after append
        env:
          BUILDER_NAME: ${{ steps.action.outputs.name }}
          BUILDER_NODES: ${{ steps.action.outputs.nodes }}
        run: |
          echo "builder name: $BUILDER_NAME"
          echo "builder nodes: $BUILDER_NODES"
          if [ -z "$BUILDER_NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS: builder name is '$BUILDER_NAME'"
