name: Test buildkitd-flags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          driver: 'docker-container'
          buildkitd-flags: '--allow-insecure-entitlement security.insecure'
          use: 'true'
      - name: Assert builder name and driver outputs are set
        env:
          BUILDER_NAME: ${{ steps.action.outputs.name }}
          BUILDER_DRIVER: ${{ steps.action.outputs.driver }}
          BUILDER_STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "name: $BUILDER_NAME"
          echo "driver: $BUILDER_DRIVER"
          echo "status: $BUILDER_STATUS"
          if [ -z "$BUILDER_NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          if [ "$BUILDER_DRIVER" != "docker-container" ]; then
            echo "FAIL: expected driver 'docker-container' but got '$BUILDER_DRIVER'"
            exit 1
          fi
          echo "PASS: builder '$BUILDER_NAME' created with buildkitd-flags"
