name: Test inline buildkitd config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: buildx
        uses: .
        with:
          driver: 'docker-container'
          use: 'true'
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Assert builder name output is set
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          echo "builder name: $BUILDER_NAME"
          if [ -z "$BUILDER_NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS: builder name is '$BUILDER_NAME'"

      - name: Assert driver output is docker-container
        env:
          DRIVER: ${{ steps.buildx.outputs.driver }}
        run: |
          echo "driver: $DRIVER"
          if [ "$DRIVER" != "docker-container" ]; then
            echo "FAIL: expected driver to be 'docker-container', got '$DRIVER'"
            exit 1
          fi
          echo "PASS: driver is 'docker-container'"

      - name: Assert builder is running
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          echo "Listing buildx builders..."
          docker buildx ls
          if ! docker buildx ls | grep -q "$BUILDER_NAME"; then
            echo "FAIL: builder '$BUILDER_NAME' not found in docker buildx ls"
            exit 1
          fi
          echo "PASS: builder '$BUILDER_NAME' found"

      - name: Assert nodes output is set
        env:
          NODES: ${{ steps.buildx.outputs.nodes }}
        run: |
          echo "nodes: $NODES"
          if [ -z "$NODES" ]; then
            echo "FAIL: expected nodes output to be set"
            exit 1
          fi
          echo "PASS: nodes output is set"
