name: Test append input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create initial builder
        id: builder
        uses: .
        with:
          driver: 'docker-container'
          use: 'true'
      - name: Append node to builder
        id: action
        uses: .
        with:
          driver: 'docker-container'
          name: ${{ steps.builder.outputs.name }}
          append: |
            - endpoint: unix:///var/run/docker.sock
          use: 'true'
      - name: Assert builder name output is set
        env:
          ACTUAL: ${{ steps.action.outputs.name }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS"
      - name: Assert nodes output is set
        env:
          ACTUAL: ${{ steps.action.outputs.nodes }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected nodes to be set"
            exit 1
          fi
          echo "PASS"
