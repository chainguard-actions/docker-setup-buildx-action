name: Test append input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create initial builder
        id: builder
        uses: .
        with:
          driver: docker-container
          use: 'true'
      - name: Assert initial builder created
        env:
          NAME: ${{ steps.builder.outputs.name }}
        run: |
          echo "name: $NAME"
          if [ -z "$NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS: initial builder created"
      - id: action
        uses: .
        with:
          name: ${{ steps.builder.outputs.name }}
          append: |
            - endpoint: unix:///var/run/docker.sock
          use: 'true'
      - name: Assert builder name output is set after append
        env:
          NAME: ${{ steps.action.outputs.name }}
          NODES: ${{ steps.action.outputs.nodes }}
        run: |
          echo "name: $NAME"
          echo "nodes: $NODES"
          if [ -z "$NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS"
