name: Test buildkitd-config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create buildkitd config file
        run: |
          mkdir -p /tmp/buildkitd-config
          cat > /tmp/buildkitd-config/buildkitd.toml <<'EOF'
          [worker.oci]
            max-parallelism = 4
          EOF
      - id: action
        uses: .
        with:
          buildkitd-config: '/tmp/buildkitd-config/buildkitd.toml'
          use: 'true'
      - name: Assert builder name output is set
        env:
          BUILDER_NAME: ${{ steps.action.outputs.name }}
        run: |
          echo "builder name: $BUILDER_NAME"
          if [ -z "$BUILDER_NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS"
      - name: Assert driver output is set
        env:
          DRIVER: ${{ steps.action.outputs.driver }}
        run: |
          echo "driver: $DRIVER"
          if [ -z "$DRIVER" ]; then
            echo "FAIL: expected driver to be set"
            exit 1
          fi
          echo "PASS"
