name: Test buildx with inline buildkitd config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: buildx
        uses: .
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Assert builder name output is set
        env:
          ACTUAL: ${{ steps.buildx.outputs.name }}
        run: |
          echo "actual name: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected builder name to be non-empty"
            exit 1
          fi
          echo "PASS: builder name is '$ACTUAL'"
      - name: Assert driver output is docker-container
        env:
          ACTUAL: ${{ steps.buildx.outputs.driver }}
        run: |
          echo "actual driver: $ACTUAL"
          if [ "$ACTUAL" != "docker-container" ]; then
            echo "FAIL: expected driver 'docker-container' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: driver is 'docker-container'"
      - name: Assert status output is running
        env:
          ACTUAL: ${{ steps.buildx.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "running" ]; then
            echo "FAIL: expected status 'running' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: status is 'running'"
