name: Test version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'latest'
          use: 'true'
          cleanup: 'true'
      - name: Assert builder name output is set
        env:
          ACTUAL: ${{ steps.action.outputs.name }}
        run: |
          echo "actual name: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty builder name"
            exit 1
          fi
          echo "PASS: builder name is $ACTUAL"
      - name: Assert buildx is available
        run: |
          docker buildx version
          echo "PASS: buildx is available"
