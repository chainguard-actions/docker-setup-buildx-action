name: Test buildkitd-flags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          driver: 'docker-container'
          buildkitd-flags: '--debug'
          use: 'true'
      - name: Assert builder name output is set
        env:
          ACTUAL: ${{ steps.action.outputs.name }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS"
      - name: Assert status output is set
        env:
          ACTUAL: ${{ steps.action.outputs.status }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected status to be set"
            exit 1
          fi
          echo "PASS"
