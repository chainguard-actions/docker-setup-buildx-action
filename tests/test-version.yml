name: Test version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          use: 'true'
      - name: Assert builder name output is set
        env:
          NAME: ${{ steps.action.outputs.name }}
          DRIVER: ${{ steps.action.outputs.driver }}
        run: |
          echo "name: $NAME"
          echo "driver: $DRIVER"
          if [ -z "$NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS"
