name: Test append input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create initial builder
        id: initial
        uses: .
        with:
          name: 'test-append-builder'
          use: 'true'
      - name: Assert initial builder name output is set
        env:
          ACTUAL: ${{ steps.initial.outputs.name }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS"
      - id: action
        uses: .
        with:
          name: 'test-append-builder'
          append: |
            - endpoint: unix:///var/run/docker.sock
          use: 'true'
      - name: Assert builder name output is set
        env:
          ACTUAL: ${{ steps.action.outputs.name }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS"
