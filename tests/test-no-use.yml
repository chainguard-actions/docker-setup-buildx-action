name: Test use=false does not switch builder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: buildx
        uses: .
        with:
          driver: 'docker-container'
          name: 'no-use-builder'
          use: 'false'
      - name: Assert builder name output is set
        env:
          ACTUAL: ${{ steps.buildx.outputs.name }}
        run: |
          echo "actual name: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected builder name to be non-empty"
            exit 1
          fi
          echo "PASS: builder name is '$ACTUAL'"
      - name: Assert builder exists but is not the active builder
        run: |
          echo "Listing builders:"
          docker buildx ls
          # The builder should exist
          if ! docker buildx ls | grep -q 'no-use-builder'; then
            echo "FAIL: builder 'no-use-builder' not found in docker buildx ls"
            exit 1
          fi
          echo "PASS: builder 'no-use-builder' exists"
          # The current builder should NOT be no-use-builder
          CURRENT=$(docker buildx ls | grep -E '^\S+\s+\*' | awk '{print $1}' || true)
          echo "current builder: $CURRENT"
          if [ "$CURRENT" = "no-use-builder" ]; then
            echo "FAIL: 'no-use-builder' should not be the active builder when use=false"
            exit 1
          fi
          echo "PASS: active builder is not 'no-use-builder'"
