name: Test fixed platforms
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: buildx
        uses: .
        with:
          platforms: 'linux/amd64,linux/arm64'
          use: 'true'
      - name: Assert name output is set
        env:
          NAME: ${{ steps.buildx.outputs.name }}
        run: |
          echo "name: $NAME"
          if [ -z "$NAME" ]; then
            echo "FAIL: expected name output to be non-empty"
            exit 1
          fi
          echo "PASS: name=$NAME"
      - name: Assert platforms output contains linux/amd64
        env:
          PLATFORMS: ${{ steps.buildx.outputs.platforms }}
        run: |
          echo "platforms: $PLATFORMS"
          if [ -z "$PLATFORMS" ]; then
            echo "FAIL: expected platforms output to be non-empty"
            exit 1
          fi
          if ! echo "$PLATFORMS" | grep -q "linux/amd64"; then
            echo "FAIL: expected platforms to contain 'linux/amd64', got '$PLATFORMS'"
            exit 1
          fi
          echo "PASS: platforms=$PLATFORMS"
      - name: Assert driver output is set
        env:
          DRIVER: ${{ steps.buildx.outputs.driver }}
        run: |
          echo "driver: $DRIVER"
          if [ -z "$DRIVER" ]; then
            echo "FAIL: expected driver output to be non-empty"
            exit 1
          fi
          echo "PASS: driver=$DRIVER"
