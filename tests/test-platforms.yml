name: Test platforms input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          driver: 'docker-container'
          platforms: 'linux/amd64,linux/arm64'
          use: 'true'
      - name: Assert builder name and platforms output are set
        env:
          BUILDER_NAME: ${{ steps.action.outputs.name }}
          BUILDER_PLATFORMS: ${{ steps.action.outputs.platforms }}
        run: |
          echo "builder name: $BUILDER_NAME"
          echo "builder platforms: $BUILDER_PLATFORMS"
          if [ -z "$BUILDER_NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS"
