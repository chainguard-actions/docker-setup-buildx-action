name: Test basic buildx setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: buildx
        uses: .
      - name: Assert builder name output is set
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          echo "builder name: $BUILDER_NAME"
          if [ -z "$BUILDER_NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS: builder name is '$BUILDER_NAME'"
      - name: Assert driver output is set
        env:
          DRIVER: ${{ steps.buildx.outputs.driver }}
        run: |
          echo "driver: $DRIVER"
          if [ -z "$DRIVER" ]; then
            echo "FAIL: expected driver to be set"
            exit 1
          fi
          echo "PASS: driver is '$DRIVER'"
      - name: Assert platforms output is set
        env:
          PLATFORMS: ${{ steps.buildx.outputs.platforms }}
        run: |
          echo "platforms: $PLATFORMS"
          if [ -z "$PLATFORMS" ]; then
            echo "FAIL: expected platforms to be set"
            exit 1
          fi
          echo "PASS: platforms is '$PLATFORMS'"
      - name: Assert nodes output is set
        env:
          NODES: ${{ steps.buildx.outputs.nodes }}
        run: |
          echo "nodes: $NODES"
          if [ -z "$NODES" ]; then
            echo "FAIL: expected nodes to be set"
            exit 1
          fi
          echo "PASS: nodes is set"
      - name: Assert builder is active via docker buildx ls
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          echo "Checking docker buildx ls for builder: $BUILDER_NAME"
          docker buildx ls
          if ! docker buildx ls | grep -q "$BUILDER_NAME"; then
            echo "FAIL: builder '$BUILDER_NAME' not found in docker buildx ls"
            exit 1
          fi
          echo "PASS: builder '$BUILDER_NAME' found in docker buildx ls"
