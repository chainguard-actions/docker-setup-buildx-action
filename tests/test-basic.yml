name: Test basic usage (docker-container driver)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          use: 'true'
      - name: Assert builder name output is set
        env:
          NAME: ${{ steps.action.outputs.name }}
        run: |
          echo "name: $NAME"
          if [ -z "$NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS: builder name is '$NAME'"
      - name: Assert driver output is set
        env:
          DRIVER: ${{ steps.action.outputs.driver }}
        run: |
          echo "driver: $DRIVER"
          if [ -z "$DRIVER" ]; then
            echo "FAIL: expected driver output to be set"
            exit 1
          fi
          echo "PASS: driver is '$DRIVER'"
      - name: Assert platforms output is set
        env:
          PLATFORMS: ${{ steps.action.outputs.platforms }}
        run: |
          echo "platforms: $PLATFORMS"
          if [ -z "$PLATFORMS" ]; then
            echo "FAIL: expected platforms output to be set"
            exit 1
          fi
          echo "PASS: platforms is '$PLATFORMS'"
      - name: Assert nodes output is set
        env:
          NODES: ${{ steps.action.outputs.nodes }}
        run: |
          echo "nodes: $NODES"
          if [ -z "$NODES" ]; then
            echo "FAIL: expected nodes output to be set"
            exit 1
          fi
          echo "PASS: nodes is set"
      - name: Assert builder is active in docker buildx
        env:
          NAME: ${{ steps.action.outputs.name }}
        run: |
          echo "Checking docker buildx ls..."
          docker buildx ls
          if ! docker buildx ls | grep -q "$NAME"; then
            echo "FAIL: builder '$NAME' not found in docker buildx ls"
            exit 1
          fi
          echo "PASS: builder '$NAME' found in docker buildx ls"
