name: Test custom builder name and use=false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: buildx
        uses: .
        with:
          name: 'my-test-builder'
          use: 'false'

      - name: Assert builder name output matches custom name
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          echo "builder name: $BUILDER_NAME"
          if [ "$BUILDER_NAME" != "my-test-builder" ]; then
            echo "FAIL: expected builder name to be 'my-test-builder', got '$BUILDER_NAME'"
            exit 1
          fi
          echo "PASS: builder name is 'my-test-builder'"

      - name: Assert driver output is set
        env:
          DRIVER: ${{ steps.buildx.outputs.driver }}
        run: |
          echo "driver: $DRIVER"
          if [ -z "$DRIVER" ]; then
            echo "FAIL: expected driver output to be set"
            exit 1
          fi
          echo "PASS: driver is '$DRIVER'"

      - name: Assert builder exists in docker buildx ls
        run: |
          echo "Listing buildx builders..."
          docker buildx ls
          if ! docker buildx ls | grep -q "my-test-builder"; then
            echo "FAIL: builder 'my-test-builder' not found in docker buildx ls"
            exit 1
          fi
          echo "PASS: builder 'my-test-builder' found"

      - name: Assert current builder is NOT my-test-builder (use=false)
        run: |
          echo "Checking current builder..."
          CURRENT=$(docker buildx ls | grep '\*' | awk '{print $1}' | tr -d '*')
          echo "Current builder: $CURRENT"
          # The current builder should not be my-test-builder since use=false
          if docker buildx ls | grep '\*' | grep -q "my-test-builder"; then
            echo "FAIL: my-test-builder should not be the current builder when use=false"
            exit 1
          fi
          echo "PASS: my-test-builder is not the current builder"
