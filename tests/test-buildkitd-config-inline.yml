name: Test buildkitd-config-inline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: buildx
        uses: .
        with:
          use: 'true'
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Assert name output is set
        env:
          NAME: ${{ steps.buildx.outputs.name }}
        run: |
          echo "name: $NAME"
          if [ -z "$NAME" ]; then
            echo "FAIL: expected name output to be non-empty"
            exit 1
          fi
          echo "PASS: name=$NAME"
      - name: Assert driver output is docker-container
        env:
          DRIVER: ${{ steps.buildx.outputs.driver }}
        run: |
          echo "driver: $DRIVER"
          if [ "$DRIVER" != "docker-container" ]; then
            echo "FAIL: expected driver to be 'docker-container', got '$DRIVER'"
            exit 1
          fi
          echo "PASS: driver=$DRIVER"
      - name: Assert platforms output is set
        env:
          PLATFORMS: ${{ steps.buildx.outputs.platforms }}
        run: |
          echo "platforms: $PLATFORMS"
          if [ -z "$PLATFORMS" ]; then
            echo "FAIL: expected platforms output to be non-empty"
            exit 1
          fi
          echo "PASS: platforms=$PLATFORMS"
      - name: Assert nodes output is set
        env:
          NODES: ${{ steps.buildx.outputs.nodes }}
        run: |
          echo "nodes: $NODES"
          if [ -z "$NODES" ]; then
            echo "FAIL: expected nodes output to be non-empty"
            exit 1
          fi
          echo "PASS: nodes=$NODES"
      - name: Assert buildx is functional
        run: |
          docker buildx version
          docker buildx inspect --bootstrap
          echo "PASS: buildx is functional with inline config"
