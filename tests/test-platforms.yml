name: Test buildx with fixed platforms
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: buildx
        uses: .
        with:
          driver: docker-container
          platforms: linux/amd64,linux/arm64
      - name: Assert builder name output is set
        env:
          ACTUAL: ${{ steps.buildx.outputs.name }}
        run: |
          echo "actual name: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected builder name to be non-empty"
            exit 1
          fi
          echo "PASS: builder name is '$ACTUAL'"
      - name: Assert platforms output contains linux/amd64
        env:
          ACTUAL: ${{ steps.buildx.outputs.platforms }}
        run: |
          echo "actual platforms: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected platforms to be non-empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "linux/amd64"; then
            echo "FAIL: expected platforms to contain 'linux/amd64' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: platforms contains 'linux/amd64'"
      - name: Assert platforms output contains linux/arm64
        env:
          ACTUAL: ${{ steps.buildx.outputs.platforms }}
        run: |
          echo "actual platforms: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "linux/arm64"; then
            echo "FAIL: expected platforms to contain 'linux/arm64' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: platforms contains 'linux/arm64'"
