name: Test version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'v0.19.3'
          use: 'true'
      - name: Assert builder name output is set
        env:
          BUILDER_NAME: ${{ steps.action.outputs.name }}
          BUILDER_DRIVER: ${{ steps.action.outputs.driver }}
        run: |
          echo "name: $BUILDER_NAME"
          echo "driver: $BUILDER_DRIVER"
          if [ -z "$BUILDER_NAME" ]; then
            echo "FAIL: expected builder name to be set"
            exit 1
          fi
          echo "PASS: builder name is '$BUILDER_NAME'"
      - name: Assert buildx version matches requested
        run: |
          VERSION=$(docker buildx version)
          echo "buildx version: $VERSION"
          if echo "$VERSION" | grep -q "v0.19.3"; then
            echo "PASS: correct buildx version installed"
          else
            echo "FAIL: expected v0.19.3 but got: $VERSION"
            exit 1
          fi
